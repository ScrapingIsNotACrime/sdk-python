name: Release

# Runs on every push to main (i.e. every merged PR). semantic-release reads the
# commits since the last v* tag: fix -> patch, feat -> minor, and while the SDK
# is 0.x a breaking change is also a minor (see .releaserc.json). docs, chore,
# test, ci and refactor commits alone publish nothing. The build job then builds
# from that tag (hatch-vcs reads the version from it) and the publish job sends
# it to PyPI via Trusted Publishing.
#
# workflow_dispatch with a `tag` input skips semantic-release entirely and
# builds + publishes that existing tag by hand — for when the publish job
# failed after a release was already tagged.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (e.g. v0.1.0), skipping semantic-release"
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Master switch: set the repository variable PYPI_PUBLISH_ENABLED to "true".
    if: github.event_name == 'push' && vars.PYPI_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the v* tag and the GitHub Release
    outputs:
      version: ${{ steps.semantic.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check . && mypy && pytest
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - id: semantic
        run: >-
          npx --yes
          -p semantic-release@25
          -p @semantic-release/exec@7
          -p conventional-changelog-conventionalcommits@9
          semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    # Runs for a fresh automatic release (release job produced a version) or
    # for a manual re-run of an existing tag. `always()` is needed because the
    # release job is skipped outright on workflow_dispatch, and a skipped
    # dependency would otherwise skip this job too.
    needs: release
    if: always() && (needs.release.outputs.version != '' || inputs.tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          if [ -n "$DISPATCH_TAG" ]; then
            echo "version=${DISPATCH_TAG#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        with:
          ref: v${{ steps.version.outputs.version }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - name: Verify the built version matches the tag exactly
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          test -f "dist/scrapingisnotacrime-$V-py3-none-any.whl"
          test -f "dist/scrapingisnotacrime-$V.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: [release, build]
    # `always()` for the same reason as the build job: `release` may be
    # skipped on workflow_dispatch, which would otherwise skip this job too.
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
